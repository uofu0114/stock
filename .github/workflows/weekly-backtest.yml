name: 週末バックテスト

on:
  schedule:
    - cron: "47 23 * * 5"   # 毎週土曜 8:47 JST
  workflow_dispatch:
    inputs:
      date:
        description: "レポートの日付 (YYYY-MM-DD、空なら今日)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを入れる
        run: pip install yfinance pandas numpy requests xlrd openpyxl

      - name: 検証を実行
        env:
          TZ: Asia/Tokyo
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python tools/weekly_backtest.py --date "${{ github.event.inputs.date }}"
          else
            python tools/weekly_backtest.py
          fi

      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add weekly
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "週末バックテスト $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
